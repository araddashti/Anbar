<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--bg:#e8f5ec;--card:#fff;--tx:#000;--mut:#2b2b2b;--ac:#1f8a4c;--acx:#fff;--bd:#bfe0ca;--warn:#c2410c;--warnbg:#fde8dc;--ok:#e3f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1{font-size:22px;margin:6px 0 2px;font-weight:800}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:12px}.stat.w b{color:var(--warn)}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;width:100%}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:9px 14px;font:inherit;font-size:14px;white-space:nowrap}
.tab{flex:1}.tab.on,.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.item{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.item.low{border-color:var(--warn);background:var(--warnbg)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:600;font-size:16px}.meta{color:var(--mut);font-size:12px;margin-top:2px}
.low .meta b{color:var(--warn)}
.tag{display:inline-block;background:var(--ok);border-radius:8px;padding:1px 8px;font-size:11px;margin-inline-end:4px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.big{font-size:24px;font-weight:800}.big small{font-size:12px;font-weight:400;color:var(--mut)}
.acts{display:flex;gap:8px}
.acts button{border-radius:12px;border:1px solid var(--bd);padding:11px 16px;font:inherit;font-weight:600;font-size:14px}
.out{background:var(--warnbg);color:var(--warn)}.in{background:var(--ok);color:var(--ac)}
.ib{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:8px}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;background:var(--ac);color:var(--acx);border:0;border-radius:999px;padding:15px 22px;font:inherit;font-weight:600;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.h{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;margin-bottom:8px;border-inline-start:5px solid var(--warn)}
.h.in{border-inline-start-color:var(--ac)}
.h .t{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.h .n{color:var(--mut);font-size:13px;margin-top:4px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow-y:auto}
.panel h2{margin:0 0 12px;font-size:18px}
.f{margin-bottom:10px}.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:6px}
.btns button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--bd);font:inherit;font-weight:600;background:var(--card);color:var(--tx)}
.btns .p{background:var(--ac);color:var(--acx);border-color:var(--ac)}.btns .d{color:var(--warn);flex:.6}
.sw{position:relative;background:#c0392b;border-radius:16px;margin-bottom:10px;overflow:hidden}.swl{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#fff;font-weight:600}.sw .item{position:relative;margin-bottom:0;touch-action:pan-y}
#msg{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px;display:none}
.full{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;width:100%;max-width:360px}
.lnk{background:none;border:0;color:var(--ac);font:inherit;font-size:13px;padding:8px 0;width:100%;text-align:center}
.toast{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:60;display:none}
.u{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.u .r{display:flex;gap:8px;margin-top:8px}.u select{padding:8px}
.u.off{opacity:.55}
</style>
</head>
<body>
<div id="gate" class="full"><div class="box">
  <div style="font-size:40px;text-align:center">📦</div>
  <h1 style="text-align:center;font-size:20px">انبار داری گرین دیلی</h1>
  <div id="gl">
    <div class="f"><label>ایمیل</label><input id="le" type="email" autocomplete="username" autocapitalize="none" dir="ltr"></div>
    <div class="f"><label>رمز عبور</label><input id="lp" type="password" autocomplete="current-password" dir="ltr"></div>

    <div class="meta" style="margin:10px 0">هنوز مدیری ثبت نشده. با ساختن این حساب، شما «مدیر کل» می‌شوید.</div>
    <div class="f"><label>نام شما</label><input id="sn" autocomplete="name"></div>
    <div id="serr" style="color:var(--warn);font-size:13px;min-height:18px;margin-bottom:6px"></div>

    <button class="lnk" onclick="doLogout()">خروج</button>
  </div>
  <div id="gp" style="display:none">
    <div id="gptxt" class="meta" style="margin:12px 0;font-size:14px"></div>
    <button class="lnk" onclick="doLogout()">خروج</button>
  </div>
</div></div>

<div class="wrap">
  <h1>📦 انبار داری گرین دیلی</h1>
  <div class="sub"><b id="who"></b> · <a href="#" onclick="doLogout();return false" style="color:var(--ac)">خروج</a></div>
  <div id="msg"></div>
  <div class="tabs"><button class="tab on" data-v="stock">انبار</button><button class="tab" data-v="hist">تاریخچه</button><button class="tab" data-v="users" id="tabU" style="display:none">کاربران</button></div>

  <div id="vStock">
    <div class="stats">
      <div class="stat"><b id="sAll">۰</b><span>تعداد محصولات</span></div>
      <div class="stat w"><b id="sLow">۰</b><span>کم‌موجود</span></div>
    </div>
    <input id="q" type="search" placeholder="جستجوی محصول…" autocomplete="off">
    <div class="chips" id="chips" style="margin-top:10px"></div>
    <div class="meta" id="swhint" style="margin-bottom:8px">برای حذف یک محصول با کل موجودی‌اش، کارت آن را به سمت راست بکشید.</div>
    <div id="list"></div>
  </div>

  <div id="vHist" style="display:none">
    <input id="hq" type="search" placeholder="جستجو در تاریخچه (نام محصول، توضیح یا نام فرد)…" autocomplete="off" style="margin-bottom:10px">
    <div id="hlist"></div>
  </div>

  <div id="vUsers" style="display:none">
    <div id="uadd" style="display:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px">
      <div style="font-weight:600;margin-bottom:8px">افزودن کاربر</div>
      <div class="f"><label>نام</label><input id="un" autocomplete="off"></div>
      <div class="f"><label>ایمیل</label><input id="ue" type="email" dir="ltr" autocapitalize="none"></div>
      <div class="g">
        <div class="f"><label>رمز (حداقل ۶ حرف)</label><input id="up" type="text" dir="ltr" autocomplete="off"></div>
        <div class="f"><label>نقش</label><select id="ur"></select></div>
      </div>
      <div class="btns"><button class="p" id="uab">ساخت کاربر</button></div>
    </div>
    <div id="ulist"></div>
    <div id="bkw" style="display:none" class="btns"><button id="bk">⬇ پشتیبان‌گیری (فایل JSON)</button></div>
  </div>
</div>
<button class="fab" id="add" style="display:none">＋ محصول جدید</button>
<div class="toast" id="toast"></div>

<div class="sheet" id="sheet"><div class="panel">
  <h2 id="pt">محصول جدید</h2>
  <div class="f"><label>نام محصول</label><input id="fn" autocomplete="off"></div>
  <div class="f"><label>دسته‌بندی</label><input id="fc" list="cats" placeholder="مثلاً مواد اولیه، بسته‌بندی…" autocomplete="off"><datalist id="cats"></datalist></div>
  <div class="g">
    <div class="f" id="fqw"><label>موجودی اولیه (اعشار مجاز)</label><input id="fq" type="number" inputmode="decimal" step="any" min="0" value="0"></div>
    <div class="f"><label>حداقل موجودی (هشدار)</label><input id="fm" type="number" inputmode="decimal" step="any" min="0" value="0"></div>
  </div>
  <div class="g">
    <div class="f"><label>واحد (عدد، کیلو، لیتر…)</label><input id="fu" value="عدد" autocomplete="off"></div>
    <div class="f"><label>یادداشت / محل قفسه</label><input id="fo" autocomplete="off"></div>
  </div>
  <div class="btns"><button class="d" id="del" style="display:none">حذف</button><button id="cancel">انصراف</button><button class="p" id="save">ذخیره</button></div>
</div></div>

<div class="sheet" id="msheet"><div class="panel">
  <h2 id="mt">برداشت</h2>
  <div class="meta" id="mi" style="margin-bottom:10px"></div>
  <div class="g">
    <div class="f"><label>تعداد (اعشار مجاز)</label><input id="ma" type="number" inputmode="decimal" step="any" min="0" value="1"></div>
    <div class="f"><label>تاریخ</label><input id="md" type="date"></div>
  </div>
  <div class="f"><label>توضیح (برای چه کاری)</label><input id="mn" autocomplete="off" placeholder="مثلاً ارسال سفارش آقای احمدی"></div>
  <div class="btns"><button id="mc">انصراف</button><button class="p" id="ms">ثبت</button></div>
</div></div>

<script>
const SB='https://zxipfvsdsntcoddlizya.supabase.co';
const KEY='sb_publishable_kqL2nA5sCHjUKPTJXh1JiQ_1fG_JXrE';
const ROLES={owner:'مدیر کل',manager:'مدیر شعبه',keeper:'مسئول انبار',accountant:'حسابدار'};
const fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:3}), $=id=>document.getElementById(id);
const fd=s=>{try{return new Date(s+'T12:00:00').toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'})}catch(e){return s}};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>{const d=document.createElement('div');d.textContent=s||'';return d.innerHTML};
const num=v=>{const x=parseFloat(String(v).replace(/[٠-٩۰-۹]/g,c=>'٠١٢٣٤٥٦٧٨٩'.includes(c)?'٠١٢٣٤٥٦٧٨٩'.indexOf(c):'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)));return isNaN(x)?0:x};
const r3=x=>Math.round(x*1000)/1000;
let sess=null,uid='',profile=null,me='';
let items=[],moves=[],users=[],cat='all',editId=null,mv=null,started=false,lastP='',lastM='',lastU='';
const role=()=>profile?profile.role:'';
const canWrite=()=>['owner','manager','keeper'].includes(role());
const canDel=()=>['owner','manager'].includes(role());
const msg=t=>{const m=$('msg');m.textContent=t;m.style.display=t?'block':'none'};
let tt;function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',5000)}
function errText(e){
  const m=String((e&&e.message)||e||''), c=(e&&e.code)||'';
  if(m.startsWith('INSUFFICIENT:'))return 'موجودی کافی نیست. موجودی فعلی: '+fa(m.split(':')[1]);
  if(m.includes('FORBIDDEN')||c==='42501'||(e&&e.status===403))return 'دسترسی ندارید. نقش شما اجازه‌ی این کار را ندارد.';
  if(m.includes('NOT_FOUND'))return 'محصول پیدا نشد (شاید حذف شده).';
  if(m.includes('BAD_INPUT'))return 'اطلاعات واردشده معتبر نیست.';
  if(m.includes('SETUP_DONE'))return 'مدیر کل قبلاً ساخته شده است.';
  if(m.includes('Invalid login credentials'))return 'ایمیل یا رمز اشتباه است.';
  if(m.includes('Email not confirmed'))return 'ایمیل تأیید نشده. در Supabase گزینه‌ی Confirm email را خاموش کنید.';
  if(m.includes('already registered')||m.includes('already been registered'))return 'این ایمیل قبلاً ثبت شده.';
  if(m.includes('at least')||m.includes('weak'))return 'رمز باید حداقل ۶ حرف باشد.';
  if(m.includes('valid email')||m.includes('Unable to validate email'))return 'ایمیل معتبر نیست.';
  if(m.toLowerCase().includes('rate limit'))return 'تعداد تلاش‌ها زیاد است. کمی بعد دوباره امتحان کنید.';
  if(m.includes('Signups not allowed'))return 'ثبت‌نام در Supabase بسته است (Authentication ← Sign In / Providers).';
  if(c==='PGRST205'||c==='42P01'||c==='PGRST202')return 'جدول‌ها یا توابع دیتابیس ساخته نشده. فایل SQL را اجرا کنید.';
  if(m.includes('Failed to fetch')||m.includes('Load failed')||m.includes('NetworkError'))return 'اینترنت یا اتصال به سرور مشکل دارد.';
  return 'خطا: '+(m||'نامشخص');
}

function loadSess(){try{sess=JSON.parse(localStorage.getItem('gd_sess')||'null')}catch(e){sess=null}}
function saveSess(s){sess=s;try{if(s)localStorage.setItem('gd_sess',JSON.stringify(s));else localStorage.removeItem('gd_sess')}catch(e){}}
function toSess(d){return{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),user:{id:d.user.id,email:d.user.email}}}
async function raw(path,opt){
  opt=opt||{};
  const h=Object.assign({apikey:KEY,'Content-Type':'application/json'},opt.headers||{});
  const r=await fetch(SB+path,Object.assign({},opt,{headers:h}));
  let d=null;try{const t=await r.text();d=t?JSON.parse(t):null}catch(e){}
  if(!r.ok){
    const er=new Error((d&&(d.message||d.msg||d.error_description||d.error))||('HTTP '+r.status));
    er.status=r.status;er.code=d&&(d.code||d.error_code);throw er;
  }
  return d;
}
async function refreshSess(){
  const d=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:sess.refresh_token})});
  saveSess(toSess(d));
}
async function api(path,opt){
  opt=opt||{};
  if(!sess)throw new Error('FORBIDDEN');
  if(sess.expires_at-60<Date.now()/1000){
    try{await refreshSess()}catch(e){saveSess(null);location.reload();throw e}
  }
  const h=Object.assign({Authorization:'Bearer '+sess.access_token},opt.headers||{});
  try{return await raw(path,Object.assign({},opt,{headers:h}))}
  catch(e){
    if(e.status===401){
      try{await refreshSess();h.Authorization='Bearer '+sess.access_token;return await raw(path,Object.assign({},opt,{headers:h}))}
      catch(e2){saveSess(null);location.reload();throw e2}
    }
    throw e;
  }
}
const rpc=(n,b)=>api('/rest/v1/rpc/'+n,{method:'POST',body:JSON.stringify(b||{})});

function render(){
  const q=$('q').value.trim(), cats=[...new Set(items.map(i=>i.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fa'));
  if(cat!=='all'&&!cats.includes(cat))cat='all';
  $('chips').innerHTML=['all',...cats].map(c=>'<button class="chip'+(c===cat?' on':'')+'" data-c="'+esc(c)+'">'+(c==='all'?'همه':esc(c))+'</button>').join('');
  $('cats').innerHTML=cats.map(c=>'<option value="'+esc(c)+'">').join('');
  $('sAll').textContent=fa(items.length);
  $('sLow').textContent=fa(items.filter(i=>i.min>0&&i.qty<=i.min).length);
  const w=canWrite();
  const v=items.filter(i=>(!q||i.name.includes(q)||i.note.includes(q))&&(cat==='all'||i.cat===cat)).sort((a,b)=>a.name.localeCompare(b.name,'fa'));
  $('list').innerHTML=v.length?v.map(i=>{const L=i.min>0&&i.qty<=i.min;
    return '<div class="sw"><div class="swl">🗑 حذف</div><div class="item'+(L?' low':'')+'" data-id="'+i.id+'"><div class="top"><div><div class="nm">'+esc(i.name)+'</div><div class="meta">'+(i.cat?'<span class="tag">'+esc(i.cat)+'</span>':'')+(L?'<b>⚠ کم‌موجود</b> · ':'')+'حداقل: '+fa(i.min)+(i.note?' · '+esc(i.note):'')+'</div></div>'+(w?'<button class="ib" data-e="'+i.id+'">ویرایش</button>':'')+'</div>'+
    '<div class="row"><div class="big">'+fa(i.qty)+' <small>'+esc(i.unit)+'</small></div>'+(w?'<div class="acts"><button class="in" data-m="in" data-id="'+i.id+'">＋ ورود</button><button class="out" data-m="out" data-id="'+i.id+'">− برداشت</button></div>':'')+'</div></div></div>'}).join(''):'<div class="empty">'+(items.length?'موردی پیدا نشد':'هنوز محصولی ثبت نشده.'+(w?'<br>با دکمه «محصول جدید» شروع کنید.':''))+'</div>';
  renderHist();
}
function renderHist(){
  const q=$('hq').value.trim();
  const v=moves.filter(m=>!q||m.name.includes(q)||m.note.includes(q)||(m.by||'').includes(q)).sort((a,b)=>(b.date.localeCompare(a.date))||(b.ts-a.ts));
  $('hlist').innerHTML=v.length?v.map(m=>'<div class="h '+m.type+'"><div class="t"><span>'+esc(m.name)+'</span><span>'+(m.type==='out'?'−':'＋')+fa(m.amount)+' '+esc(m.unit)+'</span></div><div class="meta">'+(m.by?'<b>'+(m.type==='out'?'برداشت':'ورود')+' توسط '+esc(m.by)+'</b> · ':'')+fd(m.date)+(m.cat?' · '+esc(m.cat):'')+' · موجودی بعد: '+fa(m.after)+'</div>'+(m.note?'<div class="n">'+esc(m.note)+'</div>':'')+'</div>').join(''):'<div class="empty">هنوز تغییری ثبت نشده.</div>';
}
function renderUsers(){
  const own=role()==='owner';
  $('ulist').innerHTML=users.length?users.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','fa')).map(u=>{
    const self=u.id===uid;
    return '<div class="u'+(u.active?'':' off')+'"><div class="nm">'+esc(u.name)+(self?' (شما)':'')+'</div><div class="meta" dir="ltr" style="text-align:right">'+esc(u.email)+'</div>'+
    (own&&!self?'<div class="r"><select data-ur="'+u.id+'">'+Object.keys(ROLES).map(k=>'<option value="'+k+'"'+(u.role===k?' selected':'')+'>'+ROLES[k]+'</option>').join('')+'</select><button class="ib" data-ua="'+u.id+'" data-on="'+(u.active?1:0)+'">'+(u.active?'غیرفعال کن':'فعال کن')+'</button></div>':'<div class="meta">'+(ROLES[u.role]||u.role)+(u.active?'':' · غیرفعال')+'</div>')+'</div>'}).join(''):'<div class="empty">کاربری نیست.</div>';
}

async function loadProducts(){
  const r=await api('/rest/v1/products?select=*&order=name.asc');
  const s=JSON.stringify(r);if(s===lastP)return;lastP=s;
  items=r.map(x=>({id:x.id,name:x.name||'',cat:x.cat||'',qty:+x.qty||0,min:+x.min_qty||0,unit:x.unit||'عدد',note:x.note||''}));
  render();
}
async function loadMoves(){
  const r=await api('/rest/v1/moves?select=*&order=date.desc,ts.desc&limit=1000');
  const s=JSON.stringify(r);if(s===lastM)return;lastM=s;
  moves=r.map(x=>({id:x.id,name:x.name||'',cat:x.cat||'',unit:x.unit||'',type:x.type==='in'?'in':'out',amount:+x.amount||0,after:+x.qty_after||0,date:x.date||'',note:x.note||'',by:x.by_name||'',ts:x.ts?Date.parse(x.ts):0}));
  renderHist();
}
async function loadUsers(){
  const r=await api('/rest/v1/profiles?select=*&order=created_at.asc');
  const s=JSON.stringify(r);if(s===lastU)return;lastU=s;
  users=r.map(x=>({id:x.id,name:x.name||'',email:x.email||'',role:x.role,active:!!x.active}));
  renderUsers();
}
async function refreshAll(){
  try{
    const jobs=[loadProducts(),loadMoves()];
    if(['owner','manager'].includes(role()))jobs.push(loadUsers());
    await Promise.all(jobs);msg('');
  }catch(e){msg(errText(e))}
}

function openMove(id,type){
  const it=items.find(x=>x.id===id);if(!it)return;
  mv={it,type};
  $('mt').textContent=(type==='out'?'برداشت از ':'ورود به ')+it.name;
  $('mi').textContent='موجودی فعلی: '+fa(it.qty)+' '+it.unit;
  $('ma').value=1;$('md').value=today();$('mn').value='';
  $('ms').textContent=type==='out'?'کم کن از موجودی':'اضافه کن به موجودی';
  $('msheet').classList.add('open');setTimeout(()=>$('ma').select(),50);
}
async function saveMove(){
  if(!mv)return;
  const a=r3(num($('ma').value)), {it,type}=mv;
  if(!(a>0)){$('ma').focus();return}
  const date=$('md').value||today(), note=$('mn').value.trim();
  $('ms').disabled=true;
  try{
    await rpc('apply_move',{p_pid:it.id,p_type:type,p_amount:a,p_date:date,p_note:note});
    $('msheet').classList.remove('open');mv=null;toast('ثبت شد ✓');
    await refreshAll();
  }catch(e){toast(errText(e));refreshAll()}
  $('ms').disabled=false;
}

function openSheet(it){
  editId=it?it.id:null;$('pt').textContent=it?'ویرایش محصول':'محصول جدید';
  $('fn').value=it?it.name:'';$('fc').value=it?it.cat:'';$('fq').value=0;$('fm').value=it?it.min:0;
  $('fqw').style.display=it?'none':'block';
  $('fu').value=it?it.unit:'عدد';$('fo').value=it?it.note:'';$('del').style.display=(it&&canDel())?'block':'none';
  $('sheet').classList.add('open');if(!it)setTimeout(()=>$('fn').focus(),50);
}
async function save(){
  const name=$('fn').value.trim();if(!name){$('fn').focus();return}
  const cat_=$('fc').value.trim(),min=Math.max(0,r3(num($('fm').value))),unit=$('fu').value.trim()||'عدد',note=$('fo').value.trim();
  $('save').disabled=true;
  try{
    if(editId){
      const r=await api('/rest/v1/products?id=eq.'+editId,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({name,cat:cat_,min_qty:min,unit,note,updated_at:new Date().toISOString()})});
      if(!r||!r.length)throw new Error('FORBIDDEN');
    }else{
      await rpc('create_product',{p_name:name,p_cat:cat_,p_unit:unit,p_note:note,p_min:min,p_qty:Math.max(0,r3(num($('fq').value)))});
    }
    $('sheet').classList.remove('open');toast('ذخیره شد ✓');
    await refreshAll();
  }catch(e){toast(errText(e))}
  $('save').disabled=false;
}
async function delProduct(id){
  const r=await api('/rest/v1/products?id=eq.'+id,{method:'DELETE',headers:{Prefer:'return=representation'}});
  if(!r||!r.length)throw new Error('FORBIDDEN');
}
async function remove(){
  if(!editId||!confirm('این محصول حذف شود؟ (تاریخچه‌اش می‌ماند)'))return;
  try{await delProduct(editId);$('sheet').classList.remove('open');toast('حذف شد');await refreshAll()}catch(e){toast(errText(e))}
}
async function delItem(id){
  const it=items.find(x=>x.id===id);if(!it)return;
  if(!confirm('«'+it.name+'» با کل موجودی ('+fa(it.qty)+' '+it.unit+') حذف شود؟ (تاریخچه‌اش می‌ماند)'))return;
  try{await delProduct(id);toast('حذف شد');await refreshAll()}catch(e){toast(errText(e))}
}

async function addUser(){
  const name=$('un').value.trim(),email=$('ue').value.trim(),pass=$('up').value,r=$('ur').value;
  if(!name||!email||pass.length<6){toast('نام، ایمیل و رمز (حداقل ۶ حرف) را وارد کنید.');return}
  $('uab').disabled=true;
  try{
    const d=await raw('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password:pass})});
    const nid=d&&(d.user?d.user.id:d.id);
    if(!nid)throw new Error('ساخت حساب ناموفق بود');
    await api('/rest/v1/profiles',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({id:nid,name,email,role:r,active:true})});
    $('un').value='';$('ue').value='';$('up').value='';toast('کاربر ساخته شد ✓');
    await refreshAll();
  }catch(e){toast(errText(e))}
  $('uab').disabled=false;
}
async function patchProfile(id,body){
  const r=await api('/rest/v1/profiles?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(body)});
  if(!r||!r.length)throw new Error('FORBIDDEN');
  await refreshAll();
}
async function backup(){
  try{
    const [p,m,u]=await Promise.all([api('/rest/v1/products?select=*'),api('/rest/v1/moves?select=*&order=ts.asc'),api('/rest/v1/profiles?select=id,name,email,role,active')]);
    const data={exportedAt:new Date().toISOString(),products:p,moves:m,users:u};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const file=new File([blob],'green-daily-backup-'+today()+'.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]})}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}
  }catch(e){if(e&&e.name!=='AbortError')toast(errText(e))}
}

$('list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.m)openMove(b.dataset.id,b.dataset.m);else if(b.dataset.e)openSheet(items.find(x=>x.id===b.dataset.e))});
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){cat=b.dataset.c;render()}});
$('ulist').addEventListener('change',async e=>{const s=e.target.closest('select');if(!s||!s.dataset.ur)return;try{await patchProfile(s.dataset.ur,{role:s.value});toast('نقش تغییر کرد')}catch(x){toast(errText(x))}});
$('ulist').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!b.dataset.ua)return;try{await patchProfile(b.dataset.ua,{active:b.dataset.on!=='1'})}catch(x){toast(errText(x))}});
let sx=0,sy=0,sel=null,dx=0;
$('list').addEventListener('touchstart',e=>{const it=e.target.closest('.item');if(!it||!canDel()){sel=null;return}sel=it;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;it.style.transition='none'},{passive:true});
$('list').addEventListener('touchmove',e=>{if(!sel)return;const x=e.touches[0].clientX-sx,y=e.touches[0].clientY-sy;if(dx===0&&Math.abs(y)>Math.abs(x)){sel=null;return}dx=Math.max(0,x);sel.style.transform='translateX('+dx+'px)'},{passive:true});
$('list').addEventListener('touchend',async()=>{if(!sel)return;const it=sel;sel=null;it.style.transition='transform .2s';it.style.transform='';const go=dx>110;dx=0;if(go)await delItem(it.dataset.id)});
$('add').onclick=()=>openSheet(null);
$('cancel').onclick=()=>$('sheet').classList.remove('open');
$('mc').onclick=()=>$('msheet').classList.remove('open');
$('save').onclick=save;$('del').onclick=remove;$('ms').onclick=saveMove;$('uab').onclick=addUser;$('bk').onclick=backup;
$('q').oninput=render;$('hq').oninput=renderHist;
for(const s of ['sheet','msheet'])$(s).addEventListener('click',e=>{if(e.target===$(s))$(s).classList.remove('open')});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
  const v=t.dataset.v;$('vStock').style.display=v==='stock'?'block':'none';$('vHist').style.display=v==='hist'?'block':'none';$('vUsers').style.display=v==='users'?'block':'none';
  $('add').style.display=(v==='stock'&&canWrite())?'block':'none';
});
render();

function gate(mode,txt){
  $('gate').style.display=mode?'flex':'none';
  for(const k of ['gl','gs','gp'])$(k).style.display=(k===mode)?'block':'none';
  if(txt)$('gptxt').textContent=txt;
}
async function doLogout(){
  try{if(sess)await api('/auth/v1/logout',{method:'POST'})}catch(e){}
  saveSess(null);location.reload();
}
async function login(){
  $('lerr').textContent='';
  const email=$('le').value.trim(),password=$('lp').value;
  if(!email||!password){$('lerr').textContent='ایمیل و رمز را وارد کنید.';return}
  $('lb').disabled=true;
  try{const d=await raw('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});saveSess(toSess(d));await boot()}
  catch(e){$('lerr').textContent=errText(e)}
  $('lb').disabled=false;
}
async function signup(){
  $('lerr').textContent='';
  const email=$('le').value.trim(),password=$('lp').value;
  if(!email||password.length<6){$('lerr').textContent='ایمیل و رمز (حداقل ۶ حرف) را وارد کنید.';return}
  try{
    const d=await raw('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});
    if(d&&d.access_token){saveSess(toSess(d));await boot()}
    else $('lerr').textContent='ایمیل تأیید لازم است. در Supabase گزینه‌ی Confirm email را خاموش کنید و دوباره وارد شوید.';
  }catch(e){$('lerr').textContent=errText(e)}
}
async function setupOwner(){
  const name=$('sn').value.trim();if(!name){$('serr').textContent='نام را وارد کنید.';return}
  try{await rpc('claim_owner',{p_name:name});location.reload()}
  catch(e){$('serr').textContent=errText(e)}
}
async function boot(){
  if(!sess){gate('gl');return}
  uid=sess.user.id;
  try{
    const p=await api('/rest/v1/profiles?select=*&id=eq.'+uid);
    if(p&&p.length){
      profile=p[0];
      if(!profile.active){gate('gp','حساب شما غیرفعال شده. با مدیر تماس بگیرید.');return}
      me=profile.name||sess.user.email;startApp();return;
    }
    const need=await rpc('setup_needed');
    if(need===true)gate('gs');
    else gate('gp','حساب شما ('+sess.user.email+') هنوز توسط مدیر فعال نشده. از مدیر بخواهید شما را از بخش «کاربران» اضافه کند.');
  }catch(e){gate('gp',errText(e))}
}
function startApp(){
  if(started)return;started=true;
  gate(null);
  $('who').textContent=me+' · '+(ROLES[role()]||'');
  if(canWrite())$('add').style.display='block';
  if(!canDel())$('swhint').style.display='none';
  if(['owner','manager'].includes(role()))$('tabU').style.display='block';
  if(role()==='owner'){
    $('uadd').style.display='block';$('bkw').style.display='flex';
    $('ur').innerHTML=Object.keys(ROLES).map(k=>'<option value="'+k+'">'+ROLES[k]+'</option>').join('');
  }
  refreshAll();
  setInterval(()=>{if(!document.hidden)refreshAll()},8000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll()});
}
$('lb').onclick=login;$('lsu').onclick=signup;$('sb').onclick=setupOwner;
$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
loadSess();
boot();
</script>
</body>
</html>
